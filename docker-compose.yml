services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uca
      POSTGRES_USER: uca
      POSTGRES_PASSWORD: uca
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uca"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://uca:uca@postgres:5432/uca
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: 52428800
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  uploads:
