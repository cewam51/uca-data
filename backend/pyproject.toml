[project]
name = "public-data-explorer-backend"
version = "0.1.0"
description = "API de recherche et d’analyse de données publiques"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.4.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
